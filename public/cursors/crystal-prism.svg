  <polygon points="60,10 85,35 85,80 60,110 35,80 35,35" fill="url(#crystalGrad)" stroke="#fd79a8" stroke-width="1.5" filter="url(#crystalGlow)"/>
  <polygon points="60,10 60,110 85,35 85,80" fill="#fff" opacity="0.15"/>
  <line x1="60" y1="10" x2="60" y2="110" stroke="#fff" stroke-width="1" opacity="0.3"/>
  <line x1="35" y1="35" x2="85" y2="35" stroke="#fff" stroke-width="0.8" opacity="0.2"/>
  <line x1="35" y1="80" x2="85" y2="80" stroke="#fff" stroke-width="0.8" opacity="0.2"/>
</svg>
